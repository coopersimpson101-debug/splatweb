name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # The Dawn-based GPU suite (tests/gpu.test.ts) skips itself on hosted runners (no GPU).
      # Set SPLATWEB_GPU=1 on a self-hosted GPU runner to run the real-WGSL tests too.
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
